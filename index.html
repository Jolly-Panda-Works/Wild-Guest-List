<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wild Guest List</title>
        <link rel="icon" type="image/x-icon" href="assets/img/branding/favicon.ico" />
        <link rel="stylesheet" href="assets/fonts/fonts.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <!-- ── HOME ───────────────────────────────────────────
             index.html IS Home — a top-level navigation destination,
             not a persistent parent/container for the rest of the
             app. It never initializes gameplay and never renders
             another destination's UI inside itself: Game Modes,
             Profile, Settings, and Cards are all separate documents
             (game-modes.html, profile.html, settings.html,
             cards.html) reached via real navigation — see
             js/ui/home-ui.js. "Offline Game" and "Online Game" both
             navigate to game-modes.html; the bottom-nav entries route
             to coming-soon.html rather than staying on Home. See
             docs/ARCHITECTURE_PLAN.md.

             Visual hierarchy (top → bottom): logo, secondary
             nav/profile, then the primary Play action(s) centered
             and dominant — see .home-content / .home-primary-row
             in css/style.css. -->
        <div id="homeScreen" class="screen-overlay home-screen" role="region" aria-label="Home">
            <div class="home-content">

                <div class="home-topbar">
                    <!-- Real Profile entry point: shows the player's current
                         avatar + name, navigates to profile.html (its own
                         top-level page — see js/ui/home-ui.js). Player
                         identity itself lives only in
                         js/services/profile.js; this chip just displays
                         it (js/ui/profile-ui.js). -->
                    <button id="homeProfileChip" class="home-profile-chip" type="button"
                            aria-label="Profile" data-title-key="homeProfileAriaLabel">
                        <img id="homeProfileChipAvatar" class="home-profile-chip-avatar" alt="">
                        <span id="homeProfileChipName" class="home-profile-chip-name"></span>
                    </button>

                    <div class="home-coin-pill" id="homeCoinPill" aria-label="Coins: 0">
                        <span class="home-coin-icon" aria-hidden="true">🪙</span>
                        <span class="home-coin-value" id="homeCoinValue">0</span>
                    </div>
                </div>

                <img src="assets/img/branding/banner.png" alt="Wild Guest List" class="home-banner">

                <nav class="home-secondary-row" aria-label="More">
                    <button id="homeCardsBtn" class="home-nav-btn" type="button">
                        <span class="home-nav-icon" data-icon="cards" aria-hidden="true"></span>
                        <span class="home-nav-label" data-i18n="homeCards">Card Guide</span>
                    </button>
                    <button id="homeSettingsBtn" class="home-nav-btn" type="button">
                        <span class="home-nav-icon" data-icon="settings" aria-hidden="true"></span>
                        <span class="home-nav-label" data-i18n="settingsTitle">Settings</span>
                    </button>
                    <button id="homeHowToPlayBtn" class="home-nav-btn" type="button">
                        <span class="home-nav-icon" data-icon="tutorial" aria-hidden="true"></span>
                        <span class="home-nav-label" data-i18n="homeHowToPlay">How to Play</span>
                    </button>
                    <button id="homeAboutBtn" class="home-nav-btn" type="button">
                        <span class="home-nav-icon" data-icon="About Developer" aria-hidden="true"></span>
                        <span class="home-nav-label" data-i18n="aboutTitle">About Developer</span>
                    </button>
                </nav>

                <!-- Primary Play action(s) — the dominant, centered focus
                     of Home. See .home-primary-row in css/style.css for
                     the vertical centering that keeps this the visual
                     anchor of the page regardless of viewport height. -->
                <div class="home-primary-row">
                    <button id="homeOfflineBtn" class="home-primary-btn home-play-btn" type="button">
                        <span class="home-btn-icon" data-icon="play" aria-hidden="true"></span>
                        <span data-i18n="homeOfflineGame">Offline Game</span>
                    </button>
                    <button id="homeOnlineBtn" class="home-primary-btn home-secondary-cta" type="button"
                            aria-disabled="true" data-title="Online Multiplayer — Coming Soon" data-title-key="homeOnlineComingSoonTip">
                        <span class="home-btn-icon" data-icon="globe" aria-hidden="true"></span>
                        <span data-i18n="homeOnlineGame">Online Game</span>
                        <span class="home-lock-badge" aria-hidden="true">🔒</span>
                        <span class="home-coming-soon-tag" data-i18n="comingSoon">Coming Soon</span>
                    </button>
                </div>

                <div class="home-bottom-nav" role="navigation" aria-label="Coming soon">
                    <button id="homeStoreBtn" class="home-bottom-btn" type="button">
                        <span class="home-bottom-icon" data-icon="store" aria-hidden="true"></span>
                        <span data-i18n="homeStore">Store</span>
                        <span class="home-coming-soon-tag" data-i18n="comingSoon">Coming Soon</span>
                    </button>
                    <button id="homeTournamentBtn" class="home-bottom-btn" type="button">
                        <span class="home-bottom-icon" data-icon="tournament" aria-hidden="true"></span>
                        <span data-i18n="homeTournament">Tournament</span>
                        <span class="home-coming-soon-tag" data-i18n="comingSoon">Coming Soon</span>
                    </button>
                    <button id="homeLeaderboardBtn" class="home-bottom-btn" type="button">
                        <span class="home-bottom-icon" data-icon="leaderboard" aria-hidden="true"></span>
                        <span data-i18n="homeLeaderboard">Leaderboard</span>
                        <span class="home-coming-soon-tag" data-i18n="comingSoon">Coming Soon</span>
                    </button>
                </div>

            </div>
        </div>
        <!-- About Developer -->
        <div id="aboutModal" class="modal hidden">
            <div class="modal-content small-popup about-panel">
                <button id="closeAbout" class="icon-btn close about-close">
                    <span data-icon="close"></span>
                </button>

                <div class="about-avatar">
                    <span data-icon="About Developer"></span>
                </div>

                <h3 class="about-title" data-i18n="aboutTitle">About Developer</h3>

                <div class="about-content">
                    <p>
                        <span data-i18n="aboutText">This game was designed and developed by</span>
                        <strong>Usef Farahmand</strong>.
                    </p>

                    <p data-i18n="aboutThanks">
                        Thank you for playing and supporting my work.
                    </p>

                    <div class="about-actions">
                        <a href="https://www.useffarahmand.com/"
                           target="_blank"
                           class="website-link"
                           data-i18n="aboutVisit">
                            Visit Website
                        </a>

                        <button id="aboutFeedbackBtn" type="button" class="feedback-link-btn">
                            <span data-icon="feedback"></span>
                            <span data-i18n="aboutFeedbackBtn">Give Feedback</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Feedback / Survey -->
        <div id="feedbackModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
            <div class="modal-content small-popup feedback-modal-content">
                <div class="help-header">
                    <h3 id="feedbackTitle" data-i18n="feedbackTitle">Give Feedback</h3>
                    <button id="closeFeedback" class="icon-btn close">
                        <span data-icon="close"></span>
                    </button>
                </div>

                <p class="feedback-subtitle" data-i18n="feedbackSubtitle">We'd love to hear what you think of the game.</p>

                <form id="feedbackForm" class="feedback-form" novalidate>

                    <div class="feedback-field">
                        <label class="feedback-label" data-i18n="feedbackRatingLabel">How would you rate the game?</label>
                        <div id="feedbackStars" class="feedback-stars" role="radiogroup" aria-label="Rating">
                            <button type="button" class="feedback-star" data-value="1" aria-label="1">★</button>
                            <button type="button" class="feedback-star" data-value="2" aria-label="2">★</button>
                            <button type="button" class="feedback-star" data-value="3" aria-label="3">★</button>
                            <button type="button" class="feedback-star" data-value="4" aria-label="4">★</button>
                            <button type="button" class="feedback-star" data-value="5" aria-label="5">★</button>
                        </div>
                        <input type="hidden" id="feedbackRatingInput" name="rating" value="">
                    </div>

                    <div class="feedback-field">
                        <label class="feedback-label" for="feedbackMessage" data-i18n="feedbackMessageLabel">Your comments or suggestions</label>
                        <textarea id="feedbackMessage" name="message" class="feedback-textarea" rows="4"
                                  data-i18n-placeholder="feedbackMessagePlaceholder"
                                  placeholder="What did you like? What should we improve?"></textarea>
                    </div>

                    <div class="feedback-field">
                        <label class="feedback-label" for="feedbackName" data-i18n="feedbackNameLabel">Name (optional)</label>
                        <input type="text" id="feedbackName" name="name" class="feedback-input" maxlength="40"
                               data-i18n-placeholder="feedbackNamePlaceholder" placeholder="Your name">
                    </div>

                    <div class="feedback-field">
                        <label class="feedback-label" for="feedbackEmail" data-i18n="feedbackEmailLabel">Email (optional, if you'd like a reply)</label>
                        <input type="email" id="feedbackEmail" name="email" class="feedback-input" maxlength="80"
                               data-i18n-placeholder="feedbackEmailPlaceholder" placeholder="you@example.com">
                    </div>

                    <p id="feedbackStatus" class="feedback-status" aria-live="polite"></p>

                    <button id="feedbackSubmitBtn" type="submit" class="screen-btn feedback-submit-btn" data-i18n="feedbackSubmitBtn">
                        Send Feedback
                    </button>

                </form>
            </div>
        </div>
        <div id="tutorialModal" class="modal hidden" role="dialog" aria-labelledby="tutorialTitle" aria-modal="true">

            <div class="modal-content tut-panel">

                <!-- Header -->
                <div class="tut-header">
                    <div class="tut-header-left">
                        <span class="tut-label" data-i18n="tutorialLabel">Tutorial</span>
                        <span id="tutorialCounter" class="tut-counter">1 / 6</span>
                    </div>
                    <button id="closeTutorial" class="icon-btn tut-close" aria-label="Close tutorial">
                        <span data-icon="close"></span>
                    </button>
                </div>

                <!-- Progress bar -->
                <div class="tut-progress-track">
                    <div id="tutorialProgressBar" class="tut-progress-fill"></div>
                </div>

                <!-- Body -->
                <div class="tut-body">

                    <img
                        id="tutorialImage"
                        class="tut-image"
                        alt="">

                    <div class="tut-content">
                        <h2 id="tutorialTitle" class="tut-title"></h2>
                        <div id="tutorialText" class="tut-text"></div>
                        <div id="tutorialDiagram" class="tut-diagram-wrap"></div>
                        <div id="tutorialVideo" class="tut-video-wrap"></div>
                    </div>

                </div>

                <!-- Footer -->
                <div class="tut-footer">

                    <button id="tutorialPrev" class="tut-nav-btn tut-prev" aria-label="Previous slide">
                        <span data-icon="previous"></span>
                    </button>

                    <div id="tutorialDots" class="tut-dots"></div>

                    <button id="tutorialNext" class="tut-nav-btn tut-next" aria-label="Next slide">
                        <span data-icon="next"></span>
                    </button>

                </div>

            </div>

        </div>

        <script type="module" src="js/home-main.js"></script>

    </body>
</html>
